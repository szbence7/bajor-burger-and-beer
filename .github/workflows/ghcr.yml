name: Verify and publish GHCR image

on:
  push:
    branches: [main] # main currently deploys STAGING, not production.
  workflow_dispatch:
    inputs:
      target:
        description: GitHub Environment (production requires an explicit SOURCE_BRANCH)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: ghcr-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.target || 'staging' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      SOURCE_BRANCH: ${{ vars.SOURCE_BRANCH }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLIC_URL: ${{ vars.SUPABASE_PUBLIC_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NOINDEX: ${{ (inputs.target || 'staging') == 'staging' && 'true' || 'false' }}
    steps:
      - name: Validate environment and source branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_BRANCH" || { echo 'Set environment variable SOURCE_BRANCH explicitly'; exit 1; }
          test "$GITHUB_REF" = "refs/heads/$SOURCE_BRANCH"
          if [ "$TARGET" = staging ]; then
            test "$SOURCE_BRANCH" = main
            test "$VITE_SITE_URL" = https://staging.bajorburgerandbeer.hu
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$VITE_SITE_URL" = https://bajorburgerandbeer.hu
          fi
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx tsc --noEmit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build candidate (no runtime secrets in build args)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: bajor:candidate
          build-args: |
            VITE_SITE_URL=${{ env.VITE_SITE_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bajor-${{ env.TARGET }}-arm64
          cache-to: type=gha,mode=max,scope=bajor-${{ env.TARGET }}-arm64
      - name: Check Node container against environment public database (read-only)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bajor-candidate -p 127.0.0.1:3000:3000 \
            -e SUPABASE_URL -e SUPABASE_PUBLIC_URL -e SUPABASE_ANON_KEY -e NOINDEX bajor:candidate
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          bunx playwright install --with-deps chromium
          EXPECT_SITE_URL="$VITE_SITE_URL" EXPECT_NOINDEX="$NOINDEX" node scripts/smoke-production.mjs
      - name: Container diagnostics on failure (server logs only)
        if: failure()
        run: docker logs bajor-candidate 2>&1 || true
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publish the exact image that passed the browser checks, without rebuilding it.
      - name: Publish verified image
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker tag bajor:candidate "$IMAGE:$TARGET-sha-$GITHUB_SHA"
          docker tag bajor:candidate "$IMAGE:$TARGET"
          docker push "$IMAGE:$TARGET-sha-$GITHUB_SHA"
          docker push "$IMAGE:$TARGET"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TARGET-sha-$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest (linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

  # Dormant until the later Coolify image-source migration is explicitly completed.
  # No production webhook is defined or called by this workflow.
  deploy-staging:
    needs: image
    if: >-
      ${{ (inputs.target || 'staging') == 'staging' &&
          github.ref == 'refs/heads/main' && vars.ENABLE_STAGING_COOLIFY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions: {}
    steps:
      - name: Trigger later-configured staging deployment
        env:
          COOLIFY_STAGING_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_STAGING_DEPLOY_WEBHOOK }}
          COOLIFY_STAGING_API_TOKEN: ${{ secrets.COOLIFY_STAGING_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COOLIFY_STAGING_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_STAGING_API_TOKEN"
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $COOLIFY_STAGING_API_TOKEN" \
            "$COOLIFY_STAGING_DEPLOY_WEBHOOK"
